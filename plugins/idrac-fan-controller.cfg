# iDRAC Fan Controller Configuration
# Edit these values then restart the service

IDRAC_HOST="192.168.0.141"
IDRAC_USERNAME="root"
IDRAC_PASSWORD="calvin"

# Mode: standard | stepped | interpolate
FAN_CONTROL_MODE="stepped"

# Baseline / minimum fan speed %
FAN_SPEED="5"

# Stepped mode
STEPPED_MID_TEMP="45"
STEPPED_MID_FAN_SPEED="12"
STEPPED_HIGH_TEMP="55"
STEPPED_HIGH_FAN_SPEED="20"

# Interpolate mode
INTERP_LOW_TEMP="35"
INTERP_HIGH_TEMP="55"
INTERP_HIGH_FAN_SPEED="30"

# Dell hand-back threshold (all modes)
CPU_TEMPERATURE_THRESHOLD="70"

# Check interval in seconds
CHECK_INTERVAL="60"

# Log retention in days
LOG_RETENTION_DAYS="365"

# Gen 13 and older only - set false for R740xd and newer
DISABLE_THIRD_PARTY_PCIE_CARD_DELL_DEFAULT_COOLING_RESPONSE="false"
KEEP_THIRD_PARTY_PCIE_CARD_COOLING_RESPONSE_STATE_ON_EXIT="false"
